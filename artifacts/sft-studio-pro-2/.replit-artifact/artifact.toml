kind = "web"
previewPath = "/"
title = "SFT Studio Pro 2"
description = "A supervised fine-tuning data workbench for building, validating, and exporting high-quality training datasets with DigitalOcean inference."
version = "1.0.0"
id = "artifacts/sft-studio-pro-2"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18171

[services.development]
run = "pnpm --filter @workspace/sft-studio-pro-2 run dev"

[services.production]

[services.production.build]
args = ["pnpm", "--filter", "@workspace/sft-studio-pro-2", "run", "build"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
args = ["node", "--enable-source-maps", "artifacts/sft-studio-pro-2/dist/server.cjs"]

[services.production.run.env]
PORT = "18171"
NODE_ENV = "production"

[services.production.health.startup]
path = "/"

[services.env]
PORT = "18171"
BASE_PATH = "/"
